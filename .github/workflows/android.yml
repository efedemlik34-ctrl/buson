name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests (core logic)
        run: ./scripts/build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest || echo "APK build requires Android SDK licenses; unit tests above are the required gate."

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-output
          path: build/core-tests.txt
